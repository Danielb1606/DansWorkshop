# Builds Dan's Workshop on Windows and publishes it as a GitHub Release
# whenever main is pushed with a new __version__ in workshop/core.py.
# The hub updates itself from these releases.
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path workshop/core.py -Pattern '__version__ = "(.+)"'
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" 2>$null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.exists == 'false'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        if: steps.ver.outputs.exists == 'false'
        run: pip install -r requirements.txt pyinstaller

      - name: Run checks
        if: steps.ver.outputs.exists == 'false'
        run: python tests/test_core.py

      - name: Build (one folder, runs as administrator)
        if: steps.ver.outputs.exists == 'false'
        run: >
          pyinstaller --noconfirm --windowed --uac-admin --name "Dan's Workshop"
          --icon assets/icon.ico --add-data "assets;assets"
          --exclude-module numpy --exclude-module PIL.ImageTk
          dans_workshop.py

      - name: Zip
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: Compress-Archive -Path "dist/Dan's Workshop" -DestinationPath DansWorkshop.zip

      - name: Release notes from the commit message
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          git log -1 --pretty=%B |
            Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session)' } |
            Set-Content -Encoding utf8 notes.txt

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Dan's Workshop v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: DansWorkshop.zip
          body_path: notes.txt
